<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IEWW CONTATOS</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0a0015,#1a0033,#2d0052);
  font-family:Arial, sans-serif;
  color:#fff;
  padding:25px 12px;
}

/* CARD */
.card{
  width:100%;
  max-width:420px;
  padding:40px 25px;
  border-radius:30px;
  text-align:center;

  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,0,255,0.2);

  box-shadow:
    0 0 60px rgba(255,0,255,0.2),
    0 0 120px rgba(0,255,200,0.1);
}

/* LOGO */
.logo-img{
  width:150px;
  max-width:90%;
  margin:0 auto 30px;
  display:block;

  animation:flutuar 3s ease-in-out infinite;

  filter:
    drop-shadow(0 0 20px rgba(255,255,255,0.2))
    drop-shadow(0 0 40px rgba(255,0,255,0.2));
}

@keyframes flutuar{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-12px); }
}

/* BOTÕES */
.links{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn{
  display:flex;
  align-items:center;
  padding:16px 18px;
  border-radius:18px;

  text-decoration:none;
  color:#fff;

  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,0,255,0.2);

  transition:0.3s;
}

.btn:hover{
  transform:translateY(-5px) scale(1.02);

  box-shadow:
    0 0 30px rgba(255,0,255,0.3),
    0 0 60px rgba(0,255,200,0.2);
}

.btn-content{
  display:flex;
  align-items:center;
  gap:10px;
}

.btn img{
  width:24px;
  height:24px;
}

.btn-text{
  text-align:left;
}

.btn span{
  font-size:14px;
  opacity:0.8;
}

/* RODAPÉ */
.copyright{
  margin-top:28px;
  font-size:12px;
  color:rgba(255,255,255,0.5);
  letter-spacing:1px;
  text-align:center;
  line-height:1.4;
}

/* RESPONSIVO */
@media (max-width:768px){
  body{
    justify-content:flex-start;
    padding:20px 10px 25px;
  }

  .card{
    padding:35px 22px;
    border-radius:28px;
  }

  .copyright{
    margin-top:22px;
    padding:0 20px;
  }
}

@media (max-width:380px){
  .card{
    padding:30px 18px;
  }

  .btn{
    padding:14px 15px;
  }

  .btn strong{
    font-size:15px;
  }

  .btn span{
    font-size:13px;
  }

  .logo-img{
    width:135px;
  }
}
</style>
</head>
