<title>IEWW • Links Premium</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0a0015,#1a0033,#2d0052);
  font-family:Arial, sans-serif;
  color:#fff;
}

/* CARD */
.card{
  width:100%;
  max-width:420px;
  padding:40px 25px;
  border-radius:30px;
  text-align:center;

  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,0,255,0.2);

  box-shadow:
    0 0 60px rgba(255,0,255,0.2),
    0 0 120px rgba(0,255,200,0.1);
}

/* 🔥 LOGO ANIMADA */
.logo-img{
  width:150px;
  max-width:90%;
  margin:0 auto 30px;
  display:block;

  animation:flutuar 3s ease-in-out infinite;

  filter:
    drop-shadow(0 0 20px rgba(255,255,255,0.2))
    drop-shadow(0 0 40px rgba(255,0,255,0.2));
}

@keyframes flutuar{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-12px); }
}

/* BOTÕES */
.links{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px;
  border-radius:18px;

  text-decoration:none;
  color:#fff;

  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,0,255,0.2);

  transition:0.3s;
}

.btn:hover{
  transform:translateY(-5px) scale(1.02);

  box-shadow:
    0 0 30px rgba(255,0,255,0.3),
    0 0 60px rgba(0,255,200,0.2);
}

.btn span{
  font-size:14px;
  opacity:0.8;
}

/* SOCIAL */
.social{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:12px;
}

.social a{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:rgba(255,0,255,0.1);
  border:1px solid rgba(255,0,255,0.2);

  text-decoration:none;
  color:#fff;

  transition:0.3s;
}

.social a:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px rgba(255,0,255,0.4);
}.copyright {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
  text-align: center;
}
</style>
</head>
